name: Release source and provenance
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Source validation and exact-commit packaging
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(sed -n 's/^SFXH_VERSION=//p' lib/common.sh)"
          bash tests/run-static.sh
          python3 tools/package.py --release-commit "$(git rev-parse HEAD)"
          python3 tests/package.py
          sha256sum install.sh > artifacts/install.sh.sha256
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/*
      - name: Prepare draft release for maintainer publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'Source release %s\n\nBootstrap SHA256:\n```\n' "$RELEASE_TAG" > /tmp/release-notes.md
          cat artifacts/install.sh.sha256 >> /tmp/release-notes.md
          printf '```\nSee CHANGELOG.md and docs/releases/1.1.0.md for release details and verification boundaries.\n' >> /tmp/release-notes.md
          channel=$(jq -er '.channel|select(.=="stable" or .=="pre")' data/manager-release.json)
          flags=()
          if [[ $channel == pre ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft "${flags[@]}" --title "$RELEASE_TAG" --notes-file /tmp/release-notes.md
