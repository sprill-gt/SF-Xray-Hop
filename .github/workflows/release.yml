name: Release source and provenance
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Source validation and exact-commit packaging
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(sed -n 's/^SFXH_VERSION=//p' lib/common.sh)"
          bash tests/run-static.sh
          python3 tools/package.py --release-commit "$(git rev-parse HEAD)"
          python3 tests/package.py
          sha256sum install.sh > artifacts/install.sh.sha256
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: artifacts/*
      - name: Prepare draft release for maintainer publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'Source release %s\n\nBootstrap SHA256:\n```\n' "$RELEASE_TAG" > /tmp/release-notes.md
          cat artifacts/install.sh.sha256 >> /tmp/release-notes.md
          printf '```\nSee docs/release-candidate-0.2.10.md for verification boundaries.\n' >> /tmp/release-notes.md
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --draft --prerelease --title "$RELEASE_TAG RC" --notes-file /tmp/release-notes.md
